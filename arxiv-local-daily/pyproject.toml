[project]
name = "arxiv-local-daily"
version = "0.1.0"
description = "Local-first arXiv daily crawler, database, AI summary, and discussion app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
arxiv-local-daily = "arxiv_local_daily.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
